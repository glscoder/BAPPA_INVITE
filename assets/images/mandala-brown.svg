      <path d="M-15 -178 Q0 -210 15 -178" transform="rotate(210)" />
      <path d="M-15 -178 Q0 -210 15 -178" transform="rotate(225)" />
      <path d="M-15 -178 Q0 -210 15 -178" transform="rotate(240)" />
      <path d="M-15 -178 Q0 -210 15 -178" transform="rotate(255)" />
      <path d="M-15 -178 Q0 -210 15 -178" transform="rotate(270)" />
      <path d="M-15 -178 Q0 -210 15 -178" transform="rotate(285)" />
      <path d="M-15 -178 Q0 -210 15 -178" transform="rotate(300)" />
      <path d="M-15 -178 Q0 -210 15 -178" transform="rotate(315)" />
      <path d="M-15 -178 Q0 -210 15 -178" transform="rotate(330)" />
