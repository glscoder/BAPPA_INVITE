      <path d="M0 -60 C24 -75 32 -105 0 -118 C-32 -105 -24 -75 0 -60" transform="rotate(45)" />
      <path d="M0 -60 C24 -75 32 -105 0 -118 C-32 -105 -24 -75 0 -60" transform="rotate(67.5)" />
      <path d="M0 -60 C24 -75 32 -105 0 -118 C-32 -105 -24 -75 0 -60" transform="rotate(90)" />
      <path d="M0 -60 C24 -75 32 -105 0 -118 C-32 -105 -24 -75 0 -60" transform="rotate(112.5)" />
      <path d="M0 -60 C24 -75 32 -105 0 -118 C-32 -105 -24 -75 0 -60" transform="rotate(135)" />
