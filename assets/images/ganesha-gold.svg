<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="30%" stop-color="#F7C948" />
      <stop offset="65%" stop-color="#E2A01A" />
      <stop offset="85%" stop-color="#B7791F" />
      <stop offset="100%" stop-color="#7B4905" />
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFAE19" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#FF7B00" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#991B1B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Halo -->
  <circle cx="250" cy="245" r="210" fill="url(#haloGlow)" />
  
  <!-- Outer Sacred Ring with Petals / Mandala dots -->
  <circle cx="250" cy="245" r="190" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" stroke-dasharray="4 8" opacity="0.75" />
  <circle cx="250" cy="245" r="175" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.6" />

  <!-- Radiating Divine Rays -->
  <g stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.35">
    <line x1="250" y1="45" x2="250" y2="70" />
    <line x1="250" y1="420" x2="250" y2="445" />
    <line x1="50" y1="245" x2="75" y2="245" />
    <line x1="425" y1="245" x2="450" y2="245" />
    <line x1="105" y1="100" x2="123" y2="118" />
    <line x1="395" y1="100" x2="377" y2="118" />
    <line x1="105" y1="390" x2="123" y2="372" />
    <line x1="395" y1="390" x2="377" y2="372" />
  </g>

  <!-- Ganesha Silhouette Artwork in Sacred Gold Line-art -->
  <g filter="url(#divineGlow)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Crown (Mukut) -->
    <path d="M210 110 L250 55 L290 110 Z" fill="none" stroke="url(#goldGradient)" stroke-width="4.5" />
    <path d="M225 110 L250 72 L275 110" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" />
    <circle cx="250" cy="52" r="6" fill="url(#goldGradient)" />
    <!-- Mukut Base Arches -->
    <path d="M195 125 C220 115 280 115 305 125" fill="none" stroke="url(#goldGradient)" stroke-width="4" />
    <path d="M205 133 C225 125 275 125 295 133" fill="none" stroke="url(#goldGradient)" stroke-width="2" />

    <!-- Sacred Tilak / Trishul on Forehead -->
    <path d="M250 135 L250 178" stroke="url(#goldGradient)" stroke-width="4" />
    <path d="M238 143 C242 165 248 178 250 178 C252 178 258 165 262 143" fill="none" stroke="url(#goldGradient)" stroke-width="3" />
    <circle cx="250" cy="188" r="4.5" fill="#EF4444" stroke="url(#goldGradient)" stroke-width="1" />

    <!-- Head & Ears -->
    <!-- Left Ear (Large graceful Vedic contour) -->
    <path d="M205 130 C150 135 110 170 120 230 C126 265 155 280 195 275" fill="none" stroke="url(#goldGradient)" stroke-width="5" />
    <path d="M185 155 C145 165 132 195 140 235 C145 258 165 265 188 260" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.75" />

    <!-- Right Ear -->
    <path d="M295 130 C350 135 390 170 380 230 C374 265 345 280 305 275" fill="none" stroke="url(#goldGradient)" stroke-width="5" />
    <path d="M315 155 C355 165 368 195 360 235 C355 258 335 265 312 260" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.75" />

    <!-- Temples & Brow -->
    <path d="M205 165 C225 160 240 168 250 170 C260 168 275 160 295 165" fill="none" stroke="url(#goldGradient)" stroke-width="3.5" />

    <!-- Gentle Eyes -->
    <path d="M220 182 C226 186 234 186 240 182" fill="none" stroke="url(#goldGradient)" stroke-width="3" />
    <path d="M260 182 C266 186 274 186 280 182" fill="none" stroke="url(#goldGradient)" stroke-width="3" />

    <!-- Trunk (Sond) curving gracefully to the left with Modak bowl -->
    <path d="M242 195 C244 240 238 290 220 330 C205 365 170 380 148 355 C132 338 140 310 165 305 C185 300 200 315 195 335" 
          fill="none" stroke="url(#goldGradient)" stroke-width="5.5" />
    
    <!-- Trunk sacred horizontal bands -->
    <path d="M232 235 C240 237 252 237 258 235" stroke="url(#goldGradient)" stroke-width="2" opacity="0.8" />
    <path d="M228 260 C236 262 246 262 252 260" stroke="url(#goldGradient)" stroke-width="2" opacity="0.8" />
    <path d="M220 285 C226 287 236 287 240 285" stroke="url(#goldGradient)" stroke-width="2" opacity="0.8" />

    <!-- Right Tusk (Complete) & Left Tusk (Ekadanta / Broken sacred tusk) -->
    <path d="M265 220 C272 232 282 238 290 240" fill="none" stroke="url(#goldGradient)" stroke-width="4" />
    <path d="M228 220 C222 228 218 231 214 232" fill="none" stroke="url(#goldGradient)" stroke-width="4" />

    <!-- Modak resting near trunk tip -->
    <path d="M165 305 C160 290 178 285 180 295 C185 285 198 292 195 305 Z" fill="url(#goldGradient)" stroke="#FFE29F" stroke-width="1.5" />
    <circle cx="178" cy="283" r="2.5" fill="#FFE29F" />

    <!-- Abhaya Mudra (Blessing Hand with Auspicious Om symbol) -->
    <g transform="translate(310, 270)">
      <!-- Palm -->
      <path d="M15 50 C10 30 15 15 28 5 C38 -2 52 5 55 20 C58 35 52 65 35 75 Z" fill="none" stroke="url(#goldGradient)" stroke-width="4" />
      <!-- Fingers detail -->
      <path d="M28 5 C28 -10 38 -15 42 -5 C45 5 45 18 45 25" fill="none" stroke="url(#goldGradient)" stroke-width="3" />
      <path d="M38 -5 C42 -18 52 -12 52 -2 C52 10 50 20 49 26" fill="none" stroke="url(#goldGradient)" stroke-width="3" />
      <!-- Tiny sacred Om on palm -->
      <text x="32" y="42" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle">ॐ</text>
    </g>

    <!-- Sacred Belly (Lambodara) contour & Dhoti border -->
    <path d="M195 370 C220 415 285 415 315 370" fill="none" stroke="url(#goldGradient)" stroke-width="4.5" />
    <path d="M210 385 C235 425 270 425 298 385" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6" />

    <!-- Sacred Janeyu (Sacred Thread across shoulder) -->
    <path d="M210 270 C240 310 270 350 275 390" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-dasharray="3 4" />

    <!-- Lotus Throne (Padmasana) base -->
    <path d="M130 415 C180 435 320 435 370 415" fill="none" stroke="url(#goldGradient)" stroke-width="4" />
    <path d="M150 425 C200 445 300 445 350 425" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" />
    <path d="M180 435 C220 452 280 452 320 435" fill="none" stroke="url(#goldGradient)" stroke-width="2" />
    
    <!-- Modak bowl (Laddoo Prasad) in lower left hand -->
    <ellipse cx="140" cy="365" rx="16" ry="7" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" />
    <circle cx="134" cy="358" r="4" fill="url(#goldGradient)" />
    <circle cx="144" cy="357" r="4.5" fill="url(#goldGradient)" />
    <circle cx="140" cy="352" r="3.5" fill="url(#goldGradient)" />

    <!-- Tiny Mooshak (Divine Mouse) with modak -->
    <g transform="translate(365, 385) scale(0.7)">
      <path d="M5 25 C10 15 25 15 35 22 C42 28 35 38 25 38 C15 38 2 35 5 25 Z" fill="url(#goldGradient)" opacity="0.85" />
      <circle cx="33" cy="20" r="4" fill="url(#goldGradient)" />
      <!-- Tail -->
      <path d="M5 32 C-8 32 -10 15 -5 10" fill="none" stroke="url(#goldGradient)" stroke-width="2" />
      <!-- Tiny modak -->
      <circle cx="38" cy="24" r="3" fill="#FDE047" />
    </g>
  </g>

  <!-- Twinkling Star Accent Points -->
  <g fill="#FFFDF0">
    <circle cx="150" cy="120" r="2" opacity="0.9"/>
    <circle cx="350" cy="120" r="2" opacity="0.9"/>
    <circle cx="250" cy="95" r="2.5" opacity="0.95"/>
    <circle cx="210" cy="320" r="1.5" opacity="0.8"/>
    <circle cx="290" cy="320" r="1.5" opacity="0.8"/>
  </g>
</svg>
