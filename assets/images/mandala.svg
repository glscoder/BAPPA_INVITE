<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <g transform="translate(200, 200)" stroke="url(#mandalaGold)" fill="none">
    <!-- Concentric Rings -->
    <circle r="25" stroke-width="1.5" />
    <circle r="45" stroke-width="1.2" stroke-dasharray="2 3" />
    <circle r="70" stroke-width="1.5" />
    <circle r="105" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle r="140" stroke-width="2" />
    <circle r="175" stroke-width="1" stroke-dasharray="3 5" />
    <circle r="190" stroke-width="1.5" />

    <!-- Center Flower 8 petals -->
    <g stroke-width="1.5">
      <path d="M0 0 Q15 -25 0 -45 Q-15 -25 0 0" />
      <path d="M0 0 Q15 -25 0 -45 Q-15 -25 0 0" transform="rotate(45)" />
      <path d="M0 0 Q15 -25 0 -45 Q-15 -25 0 0" transform="rotate(90)" />
      <path d="M0 0 Q15 -25 0 -45 Q-15 -25 0 0" transform="rotate(135)" />
      <path d="M0 0 Q15 -25 0 -45 Q-15 -25 0 0" transform="rotate(180)" />
      <path d="M0 0 Q15 -25 0 -45 Q-15 -25 0 0" transform="rotate(225)" />
      <path d="M0 0 Q15 -25 0 -45 Q-15 -25 0 0" transform="rotate(270)" />
      <path d="M0 0 Q15 -25 0 -45 Q-15 -25 0 0" transform="rotate(315)" />
    </g>

    <!-- 16 Petals Ring -->
    <g stroke-width="1.2">
      <!-- Repeated around circle -->
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(22.5)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(45)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(67.5)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(90)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(112.5)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(135)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(157.5)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(180)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(202.5)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(225)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(247.5)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(270)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(292.5)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(315)" />
      <path d="M0 -45 C20 -60 30 -85 0 -105 C-30 -85 -20 -60 0 -45" transform="rotate(337.5)" />
    </g>

    <!-- Outer Arch Motifs -->
    <g stroke-width="1.5">
      <path d="M-15 -140 Q0 -165 15 -140" />
      <path d="M-15 -140 Q0 -165 15 -140" transform="rotate(30)" />
      <path d="M-15 -140 Q0 -165 15 -140" transform="rotate(60)" />
      <path d="M-15 -140 Q0 -165 15 -140" transform="rotate(90)" />
      <path d="M-15 -140 Q0 -165 15 -140" transform="rotate(120)" />
      <path d="M-15 -140 Q0 -165 15 -140" transform="rotate(150)" />
      <path d="M-15 -140 Q0 -165 15 -140" transform="rotate(180)" />
      <path d="M-15 -140 Q0 -165 15 -140" transform="rotate(210)" />
      <path d="M-15 -140 Q0 -165 15 -140" transform="rotate(240)" />
      <path d="M-15 -140 Q0 -165 15 -140" transform="rotate(270)" />
      <path d="M-15 -140 Q0 -165 15 -140" transform="rotate(300)" />
      <path d="M-15 -140 Q0 -165 15 -140" transform="rotate(330)" />
    </g>
  </g>
</svg>
