<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="100%" height="100%">
  <defs>
    <linearGradient id="hedgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70B83E" />
      <stop offset="50%" stop-color="#4B9426" />
      <stop offset="100%" stop-color="#2D6017" />
    </linearGradient>
    <radialGradient id="hedgePuff" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#95D94D" />
      <stop offset="70%" stop-color="#4D9628" />
      <stop offset="100%" stop-color="#2D6017" />
    </radialGradient>
    <linearGradient id="hedgeLotus" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D9480F" />
      <stop offset="50%" stop-color="#F76707" />
      <stop offset="100%" stop-color="#FFA94D" />
    </linearGradient>
  </defs>

  <!-- Rolling Bush Mound Shapes -->
  <g>
    <circle cx="60" cy="80" r="65" fill="url(#hedgePuff)" />
    <circle cx="160" cy="75" r="70" fill="url(#hedgePuff)" />
    <circle cx="260" cy="82" r="68" fill="url(#hedgePuff)" />
    <circle cx="360" cy="74" r="72" fill="url(#hedgePuff)" />
    <circle cx="450" cy="80" r="65" fill="url(#hedgePuff)" />
    <rect x="0" y="75" width="500" height="25" fill="#2D6017" />
  </g>

  <!-- Left Lotus on hedge -->
  <g transform="translate(30, 45) scale(0.9)">
    <path d="M5 25 C12 8 24 6 25 20 C20 23 10 25 5 25 Z" fill="url(#hedgeLotus)" />
    <path d="M45 25 C38 8 26 6 25 20 C30 23 40 25 45 25 Z" fill="url(#hedgeLotus)" />
    <path d="M25 5 C21 14 20 20 25 25 C30 20 29 14 25 5 Z" fill="#FFC078" />
  </g>

  <!-- Right Lotus on hedge -->
  <g transform="translate(425, 45) scale(0.9)">
    <path d="M5 25 C12 8 24 6 25 20 C20 23 10 25 5 25 Z" fill="url(#hedgeLotus)" />
    <path d="M45 25 C38 8 26 6 25 20 C30 23 40 25 45 25 Z" fill="url(#hedgeLotus)" />
    <path d="M25 5 C21 14 20 20 25 25 C30 20 29 14 25 5 Z" fill="#FFC078" />
  </g>

  <!-- Little scattered petals on hedge -->
  <g fill="#E03131">
    <ellipse cx="110" cy="65" rx="4" ry="2" transform="rotate(25 110 65)" />
    <ellipse cx="210" cy="68" rx="3.5" ry="2" transform="rotate(-15 210 68)" />
    <ellipse cx="290" cy="62" rx="4" ry="2.2" transform="rotate(35 290 62)" />
    <ellipse cx="380" cy="66" rx="3.5" ry="2" transform="rotate(-20 380 66)" />
  </g>
</svg>
