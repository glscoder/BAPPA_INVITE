<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="30%" stop-color="#F97316" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>
    <filter id="diyaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Radiant Aura -->
  <circle cx="50" cy="35" r="28" fill="url(#flameGlow)" />

  <!-- Diya Brass Bowl Base -->
  <g filter="url(#diyaGlow)">
    <path d="M18 55 C18 78 82 78 82 55 C82 50 72 48 50 48 C28 48 18 50 18 55 Z" fill="url(#brassGold)" />
    <!-- Lip rim -->
    <ellipse cx="50" cy="50" rx="32" ry="6" fill="#D97706" stroke="#FFF3C4" stroke-width="1" />
    <ellipse cx="50" cy="50" rx="26" ry="4" fill="#92400E" />
    <!-- Pedestal Base -->
    <path d="M38 72 C42 78 58 78 62 72 L65 82 C55 84 45 84 35 82 Z" fill="url(#brassGold)" />
    <ellipse cx="50" cy="83" rx="16" ry="3" fill="#B45309" stroke="#FDE047" stroke-width="0.8" />
  </g>

  <!-- Flame (Flickering SVG Path) -->
  <g class="diya-flame-motion">
    <path d="M50 12 C44 26 38 36 44 48 C47 52 53 52 56 48 C62 36 56 26 50 12 Z" fill="url(#flameGrad)" />
    <!-- Inner bright core -->
    <path d="M50 22 C47 30 44 37 47 45 C49 47 51 47 53 45 C56 37 53 30 50 22 Z" fill="#FFFBEB" opacity="0.9" />
  </g>
</svg>
